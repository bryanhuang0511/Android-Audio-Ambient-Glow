[Metadata]
Name=BTunes Organic White Pro
Author=Rainmeter Project
Version=10.0

[Rainmeter]
Update=16
AccurateText=1
SkinWidth=600
SkinHeight=600

[Variables]
CX=300
CY=300
R=130
S=160
ImgS=180
Corn=12

[MeasureAudioRaw]
Measure=Plugin
Plugin=AudioLevel
Port=Output
FFTSize=2048
FFTAttack=25
FFTDecay=150
Bands=13
FreqMin=20
FreqMax=16000
Sensitivity=55

[MeasureBass]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudioRaw
Type=Band
BandIdx=0

