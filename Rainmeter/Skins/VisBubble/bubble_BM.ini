[MeterOrganicBlob]
Meter=Shape
Shape=Path MyPath | Fill Color 255,255,255,220 | StrokeWidth 0
MyPath=(#CX#+(#R#+[M0]*#S#)*Cos(PI/2)),(#CY#+(#R#+[M0]*#S#)*Sin(PI/2)) | LineTo (#CX#+(#R#+[M1]*#S#)*Cos(PI/2+PI/12)),(#CY#+(#R#+[M1]*#S#)*Sin(PI/2+PI/12)) | LineTo (#CX#+(#R#+[M2]*#S#)*Cos(PI/2+2*PI/12)),(#CY#+(#R#+[M2]*#S#)*Sin(PI/2+2*PI/12)) | LineTo (#CX#+(#R#+[M3]*#S#)*Cos(PI/2+3*PI/12)),(#CY#+(#R#+[M3]*#S#)*Sin(PI/2+3*PI/12)) | LineTo (#CX#+(#R#+[M4]*#S#)*Cos(PI/2+4*PI/12)),(#CY#+(#R#+[M4]*#S#)*Sin(PI/2+4*PI/12)) | LineTo (#CX#+(#R#+[M5]*#S#)*Cos(PI/2+5*PI/12)),(#CY#+(#R#+[M5]*#S#)*Sin(PI/2+5*PI/12)) | LineTo (#CX#+(#R#+[M6]*#S#)*Cos(PI/2+6*PI/12)),(#CY#+(#R#+[M6]*#S#)*Sin(PI/2+6*PI/12)) | LineTo (#CX#+(#R#+[M7]*#S#)*Cos(PI/2+7*PI/12)),(#CY#+(#R#+[M7]*#S#)*Sin(PI/2+7*PI/12)) | LineTo (#CX#+(#R#+[M8]*#S#)*Cos(PI/2+8*PI/12)),(#CY#+(#R#+[M8]*#S#)*Sin(PI/2+8*PI/12)) | LineTo (#CX#+(#R#+[M9]*#S#)*Cos(PI/2+9*PI/12)),(#CY#+(#R#+[M9]*#S#)*Sin(PI/2+9*PI/12)) | LineTo (#CX#+(#R#+[M10]*#S#)*Cos(PI/2+10*PI/12)),(#CY#+(#R#+[M10]*#S#)*Sin(PI/2+10*PI/12)) | LineTo (#CX#+(#R#+[M11]*#S#)*Cos(PI/2+11*PI/12)),(#CY#+(#R#+[M11]*#S#)*Sin(PI/2+11*PI/12)) | LineTo (#CX#+(#R#+[M12]*#S#)*Cos(PI/2+12*PI/12)),(#CY#+(#R#+[M12]*#S#)*Sin(PI/2+12*PI/12)) | LineTo (#CX#+(#R#+[M11]*#S#)*Cos(PI/2+13*PI/12)),(#CY#+(#R#+[M11]*#S#)*Sin(PI/2+13*PI/12)) | LineTo (#CX#+(#R#+[M10]*#S#)*Cos(PI/2+14*PI/12)),(#CY#+(#R#+[M10]*#S#)*Sin(PI/2+14*PI/12)) | LineTo (#CX#+(#R#+[M9]*#S#)*Cos(PI/2+15*PI/12)),(#CY#+(#R#+[M9]*#S#)*Sin(PI/2+15*PI/12)) | LineTo (#CX#+(#R#+[M8]*#S#)*Cos(PI/2+16*PI/12)),(#CY#+(#R#+[M8]*#S#)*Sin(PI/2+16*PI/12)) | LineTo (#CX#+(#R#+[M7]*#S#)*Cos(PI/2+17*PI/12)),(#CY#+(#R#+[M7]*#S#)*Sin(PI/2+17*PI/12)) | LineTo (#CX#+(#R#+[M6]*#S#)*Cos(PI/2+18*PI/12)),(#CY#+(#R#+[M6]*#S#)*Sin(PI/2+18*PI/12)) | LineTo (#CX#+(#R#+[M5]*#S#)*Cos(PI/2+19*PI/12)),(#CY#+(#R#+[M5]*#S#)*Sin(PI/2+19*PI/12)) | LineTo (#CX#+(#R#+[M4]*#S#)*Cos(PI/2+20*PI/12)),(#CY#+(#R#+[M4]*#S#)*Sin(PI/2+20*PI/12)) | LineTo (#CX#+(#R#+[M3]*#S#)*Cos(PI/2+21*PI/12)),(#CY#+(#R#+[M3]*#S#)*Sin(PI/2+21*PI/12)) | LineTo (#CX#+(#R#+[M2]*#S#)*Cos(PI/2+22*PI/12)),(#CY#+(#R#+[M2]*#S#)*Sin(PI/2+22*PI/12)) | LineTo (#CX#+(#R#+[M1]*#S#)*Cos(PI/2+23*PI/12)),(#CY#+(#R#+[M1]*#S#)*Sin(PI/2+23*PI/12)) | ClosePath 1
DynamicVariables=1

[MeterImageMask]
Meter=Shape
Shape=Rectangle (#CX#-(#ImgS#+[MeasureBass]*40)/2),(#CY#-(#ImgS#+[MeasureBass]*40)/2),(#ImgS#+[MeasureBass]*40),(#ImgS#+[MeasureBass]*40),#Corn# | Fill Color 0,0,0,255 | StrokeWidth 0
DynamicVariables=1

[MeterCenterImage]
Meter=Image
ImageName=BM.jpg
W=(#ImgS# + [MeasureBass]*40)
H=(#ImgS# + [MeasureBass]*40)
X=(#CX# - (#ImgS# + [MeasureBass]*40)/2)
Y=(#CY# - (#ImgS# + [MeasureBass]*40)/2)
PreserveAspectRatio=2
Container=MeterImageMask
DynamicVariables=1