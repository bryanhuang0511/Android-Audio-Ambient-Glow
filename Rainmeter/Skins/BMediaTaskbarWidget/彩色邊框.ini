[Rainmeter]
Update=16
AccurateText=1
MiddleMouseUpAction=[!Refresh]
OnRefreshAction=[!CommandMeasure MeasureActionTimer "Execute 1"]

[Metadata]
Name=BTunes Taskbar Widget (Rainbow Wave + Rotating Border)
Author=Partner Modified
Information=Pulsing rainbow wave + rotating gradient border with bass response
Version=1.0

[Variables]
BaseWidth=564
BaseHeight=46
AlbumArtSize=36
TextFontSize=13
DetailsFontColor=30,30,30

animationSpeed=32
marqueeBeginWait=1500
marqueeEndWait=1500
marquee1=0

W0=0
W1=0
W2=0
W3=0
W4=0
W5=0
W6=0
W7=0
W8=0
W9=0
W10=0
W11=0
W12=0
W13=0
W14=0

; =========================================
; 音訊輸入（必須在所有引用前定義）
; =========================================
[MeasureAudioRaw]
Measure=Plugin
Plugin=AudioLevel
Port=Output
FFTSize=1024
FFTAttack=30
FFTDecay=45
Bands=3
FreqMin=20
FreqMax=16000
Sensitivity=42

[MeasureBass]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudioRaw
Type=Band
BandIdx=0

[MeasureMid]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudioRaw
Type=Band
BandIdx=1

[MeasureHigh]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudioRaw
Type=Band
BandIdx=2

; =========================================
; 彩虹邊框色彩引擎（保留，波紋已移除）
; =========================================
; 💡 核心概念：邊框漸層固定（上下方向），但色彩序列根據時間偏移
; 這樣看起來就像七彩色帶在邊框上跑動

; 色帶位置 (0-1，代表在1個完整七彩周期中的位置)
; 基礎速度 + 根據低音加速
[MeasureColorPhase]
Measure=Calc
Formula=(MeasureColorPhase + 0.003 + [MeasureBass]*0.05) % 1.0
DynamicVariables=1

; 色相偏移量（0-360度）
[MeasureColorShift]
Measure=Calc
Formula=MeasureColorPhase * 360
DynamicVariables=1

; 根據偏移計算當前主色 RGB
[MeasureMainR]
Measure=Calc
Formula=Trunc(Sin(MeasureColorShift * 0.01745) * 127 + 128)
DynamicVariables=1

[MeasureMainG]
Measure=Calc
Formula=Trunc(Sin((MeasureColorShift + 120) * 0.01745) * 127 + 128)
DynamicVariables=1

[MeasureMainB]
Measure=Calc
Formula=Trunc(Sin((MeasureColorShift + 240) * 0.01745) * 127 + 128)
DynamicVariables=1

; 另外兩種色彩（偏移 120 和 240 度）
[MeasureSecondR]
Measure=Calc
Formula=Trunc(Sin((MeasureColorShift + 120) * 0.01745) * 127 + 128)
DynamicVariables=1

[MeasureSecondG]
Measure=Calc
Formula=Trunc(Sin((MeasureColorShift + 240) * 0.01745) * 127 + 128)
DynamicVariables=1

[MeasureSecondB]
Measure=Calc
Formula=Trunc(Sin((MeasureColorShift + 360) * 0.01745) * 127 + 128)
DynamicVariables=1

[MeasureThirdR]
Measure=Calc
Formula=Trunc(Sin((MeasureColorShift + 240) * 0.01745) * 127 + 128)
DynamicVariables=1

[MeasureThirdG]
Measure=Calc
Formula=Trunc(Sin((MeasureColorShift + 360) * 0.01745) * 127 + 128)
DynamicVariables=1

[MeasureThirdB]
Measure=Calc
Formula=Trunc(Sin((MeasureColorShift + 120) * 0.01745) * 127 + 128)
DynamicVariables=1

[MeasureEnergy]
Measure=Calc
Formula=0
; 波紋已移除，此 Measure 保留但不使用

[MeasureEnergySmooth]
Measure=Calc
Formula=0

[MeasurePropagate]
Measure=Calc
Formula=1
; 波紋傳播已移除

[MeasurePlayer]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=PLAYER

[MeasureTitle]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=TITLE
DynamicVariables=1
OnChangeAction=[!SetVariable marquee1 0][!CommandMeasure MeasureActionTimer "Execute 1"]

[MeasureArtist]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=ARTIST
DynamicVariables=1

[MeasureDuration]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=DURATION
OnChangeAction=[!SetVariable marquee1 0][!CommandMeasure MeasureActionTimer "Execute 1"]
IfCondition=MeasureDuration < 1
IfTrueAction=[!Hide]
IfFalseAction=[!Show]

[MeasureMarquee1Offset]
Measure=Calc
Formula=max(0,([MeterDetails:W] - [MeterDetailContainer:W]))
DynamicVariables=1

[MeasureActionTimer]
Measure=Plugin
Plugin=ActionTimer
IgnoreExecution=1
ActionList1=Repeat Move1,#animationSpeed#,[MeasureMarquee1Offset:] | Wait #marqueeEndWait# | Reset1 | Wait #marqueeBeginWait# | DoOver1
Reset1=[!SetVariable marquee1 0][!UpdateMeasure MeasureActionTimer][!UpdateMeter MeterDetails][!Redraw]
Move1=[!SetVariable marquee1 "(#marquee1# - 1)"][!UpdateMeasure MeasureActionTimer][!UpdateMeter MeterDetails][!Redraw]
DoOver1=[!CommandMeasure MeasureActionTimer "Execute 1"]
DynamicVariables=1

[MeasureAlbumArt]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Cover
DefaultPath=
UpdateDivider=5

; =========================================
; 3. 顯示介面（移除波紋，只保留邊框和背景）
; =========================================

; 💡 彩虹邊框（在下層）
[MeterFrostedGlassBG]
Meter=Shape
Shape=Rectangle 4,4,(#BaseWidth#-8),(#BaseHeight#-8),8 | Fill Color 0,0,0,0 | Stroke LinearGradient MyGradient | StrokeWidth 8
; 色帶在邊框上移動的錯覺
MyGradient=0,0,0,46 | [MeasureMainR],[MeasureMainG],[MeasureMainB],255 ; 0.0 | [MeasureSecondR],[MeasureSecondG],[MeasureSecondB],255 ; 0.5 | [MeasureThirdR],[MeasureThirdG],[MeasureThirdB],255 ; 1.0
DynamicVariables=1
X=0
Y=0

; 💡 白色半透明背景（在最上層）
[MeterBorderCap]
Meter=Shape
Shape=Rectangle 0,0,#BaseWidth#,#BaseHeight#,10 | Fill Color 255,255,255,100 | StrokeWidth 0
X=0
Y=0

[MeterAlbumArt]
Meter=Image
h=#AlbumArtSize#
w=#AlbumArtSize#
X=5
Y=5
MeasureName=MeasureAlbumArt
PreserveAspectRatio=1

[MeterDetailContainer]
Meter=Shape
Shape=Rectangle 0,0,484,30
X=60
Y=14

[MeterDetails]
Meter=String
MeasureName=MeasureArtist
MeasureName2=MeasureTitle
AntiAlias=1
FontColor=#DetailsFontColor#
FontFace=Segoe UI
FontWeight=700
FontSize=#TextFontSize#
Text="%1 | %2"
X=(242 + #marquee1#)
Y=0
StringAlign=Center
Container=MeterDetailContainer
DynamicVariables=1