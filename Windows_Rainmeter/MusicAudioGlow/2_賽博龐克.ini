[Rainmeter]
; 144Hz Refresh Rate (7ms per tick)
Update=7
AccurateText=1
DynamicWindowSize=0
ClickThrough=1
KeepOnScreen=0
AlwaysOnTop=2
OnRefreshAction=[!ZPos 2][!ClickThrough 1][!Draggable 0]

; 右鍵選單快速切換 5 大色彩主題 (右鍵即可秒切)
ContextTitle="🌈 風格 1: 全彩光譜閉環 (Rainbow)"
ContextAction=[!SetVariable ColorStyle 1][!WriteKeyValue Variables ColorStyle 1][!Refresh]
ContextTitle2="⚡ 風格 2: 賽博龐克 (Cyberpunk)"
ContextAction2=[!SetVariable ColorStyle 2][!WriteKeyValue Variables ColorStyle 2][!Refresh]
ContextTitle3="🌅 風格 3: 落日金光 (Sunset Gold)"
ContextAction3=[!SetVariable ColorStyle 3][!WriteKeyValue Variables ColorStyle 3][!Refresh]
ContextTitle4="🌌 風格 4: 極光綠境 (Aurora)"
ContextAction4=[!SetVariable ColorStyle 4][!WriteKeyValue Variables ColorStyle 4][!Refresh]
ContextTitle5="🔥 風格 5: 熔岩烈焰 (Lava Crimson)"
ContextAction5=[!SetVariable ColorStyle 5][!WriteKeyValue Variables ColorStyle 5][!Refresh]
ContextTitle6="---"
ContextAction6=[]
ContextTitle7="⚙️ 重新整理流光 (Refresh)"
ContextAction7=[!Refresh]

[Metadata]
Name=Music Screen Glow (Version 2.0 Pure Length Master)
Author=Antigravity and Partner
Information=Continuous 360-degree perimeter racetrack rainbow loop, 100% constant hue across thickness (Zero RGB thickness gradient, pure Gaussian inward brightness fade), mathematically closed 4-corner matching (Top-Left: CA, Top-Right: CB, Bottom-Right: CA, Bottom-Left: CB), fast ~0.9s fade-in / ~1.1s total shutoff, locked 144 FPS, WASAPI bass acceleration.
Version=2.0

[Variables]
ScreenWidth=1707
ScreenHeight=960
BloomDepth=32

; =======================================================
; COLOR STYLE SELECTOR (風格選擇器 - 填入 1 到 5 即可直接切換)
; 1 = Rainbow (全彩光譜閉環 - 經典 360° 全彩漸變)
; 2 = Cyberpunk (賽博龐克 - 霓虹青 / 螢光粉 科技狂熱)
; 3 = Sunset (落日金光 - 熾熱金橙 / 魅惑洋紅 溫暖流光)
; 4 = Aurora (極光綠境 - 翡翠碧綠 / 冰川冰藍 夢幻夜空)
; 5 = Lava (熔岩烈焰 - 烈焰赤紅 / 狂暴金黃 重低音必備)
; =======================================================
ColorStyle=2

AudioSensitivity=42
AudioAttack=10
AudioDecay=35

; =======================================================
; 1. INSTANTANEOUS WASAPI AUDIO SENSING & NOISE GATE
; =======================================================
[MeasureAudioRaw]
Measure=Plugin
Plugin=AudioLevel
Port=Output
FFTSize=1024
FFTAttack=#AudioAttack#
FFTDecay=#AudioDecay#
Bands=4
FreqMin=20
FreqMax=16000
Sensitivity=#AudioSensitivity#

[MeasureAudioRMS]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudioRaw
Type=RMS

[MeasureBass]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudioRaw
Type=Band
BandIdx=0

[MeasureLowMid]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudioRaw
Type=Band
BandIdx=1

; Direct Beat Energy (0ms surge)
[MeasureBeatEnergy]
Measure=Calc
Formula=Clamp([MeasureBass] * 1.6 + [MeasureLowMid] * 0.7, 0, 1.6)
DynamicVariables=1

; =======================================================
; 2. ULTRA-FAST <1.0S FADE-IN & 100% TOTAL SHUTOFF (快開快關)
; =======================================================
; Robust Noise Gate: RMS < 0.012 -> 0 (avoids system background hiss staying on)
[MeasureTargetAlpha]
Measure=Calc
Formula=([MeasureAudioRMS] < 0.012 ? 0 : 255)
DynamicVariables=1

; Exponential 144Hz Alpha Follower (~0.9s in, ~1.1s out @ 144Hz)
[MeasureSmoothAlpha]
Measure=Calc
Formula=(MeasureSmoothAlpha + ([MeasureTargetAlpha] > MeasureSmoothAlpha ? ([MeasureTargetAlpha] - MeasureSmoothAlpha) * 0.023 : ([MeasureTargetAlpha] - MeasureSmoothAlpha) * 0.019))
DynamicVariables=1

; Master Alpha (Snaps to 100% total off if < 3.0)
[MeasureAlpha]
Measure=Calc
Formula=(MeasureSmoothAlpha < 3.0 ? 0 : Clamp(Trunc(MeasureSmoothAlpha), 0, 255))
DynamicVariables=1

; =======================================================
; 3. 144FPS PERIMETER RACETRACK SPEED ENGINE ("跑起來" 狂飆)
; =======================================================
; Cruise speed: 0.004 (~0.58 lap/s), Heavy beat acceleration up to ~0.031 (~4.4 laps/s)
[MeasurePerimeterPhase]
Measure=Calc
Formula=(MeasurePerimeterPhase + 0.004 + [MeasureBeatEnergy] * 0.017) % 1.0
DynamicVariables=1

; Base Angle from Phase
[MeasureBaseDeg]
Measure=Calc
Formula=MeasurePerimeterPhase * 360
DynamicVariables=1

; =======================================================
; 4. MATHEMATICAL 5-STYLE COLOR ENGINE
; =======================================================

; Normalized Sinusoidal Interpolation Factors [0.0 ~ 1.0] for Preset Dual-Themes
[MeasureWaveA]
Measure=Calc
Formula=(Sin((MeasureBaseDeg + 0.0) * 0.01745) + 1.0) * 0.5
DynamicVariables=1

[MeasureWaveMid1]
Measure=Calc
Formula=(Sin((MeasureBaseDeg + 90.0) * 0.01745) + 1.0) * 0.5
DynamicVariables=1

[MeasureWaveB]
Measure=Calc
Formula=(Sin((MeasureBaseDeg + 180.0) * 0.01745) + 1.0) * 0.5
DynamicVariables=1

[MeasureWaveMid2]
Measure=Calc
Formula=(Sin((MeasureBaseDeg + 270.0) * 0.01745) + 1.0) * 0.5
DynamicVariables=1

; --- Primary Color A (0.0 deg) ---
[MeasureCA_R]
Measure=Calc
Formula=(#ColorStyle# = 1 ? Trunc(Sin((MeasureBaseDeg + 0.0) * 0.01745) * 127 + 128) : (#ColorStyle# = 2 ? Trunc(255 - [MeasureWaveA] * 255) : (#ColorStyle# = 3 ? 255 : (#ColorStyle# = 4 ? 0 : Trunc(255 - [MeasureWaveA] * 35)))))
DynamicVariables=1
[MeasureCA_G]
Measure=Calc
Formula=(#ColorStyle# = 1 ? Trunc(Sin((MeasureBaseDeg + 120.0) * 0.01745) * 127 + 128) : (#ColorStyle# = 2 ? Trunc(20 + [MeasureWaveA] * 220) : (#ColorStyle# = 3 ? Trunc(170 - [MeasureWaveA] * 110) : (#ColorStyle# = 4 ? Trunc(255 - [MeasureWaveA] * 75) : Trunc(140 - [MeasureWaveA] * 140)))))
DynamicVariables=1
[MeasureCA_B]
Measure=Calc
Formula=(#ColorStyle# = 1 ? Trunc(Sin((MeasureBaseDeg + 240.0) * 0.01745) * 127 + 128) : (#ColorStyle# = 2 ? Trunc(147 + [MeasureWaveA] * 108) : (#ColorStyle# = 3 ? Trunc([MeasureWaveA] * 80) : (#ColorStyle# = 4 ? Trunc(136 + [MeasureWaveA] * 119) : Trunc([MeasureWaveA] * 30)))))
DynamicVariables=1

; --- Midpoint Color 1 (90.0 deg) ---
[MeasureMid1_R]
Measure=Calc
Formula=(#ColorStyle# = 1 ? Trunc(Sin((MeasureBaseDeg + 90.0) * 0.01745) * 127 + 128) : (#ColorStyle# = 2 ? Trunc(255 - [MeasureWaveMid1] * 255) : (#ColorStyle# = 3 ? 255 : (#ColorStyle# = 4 ? 0 : Trunc(255 - [MeasureWaveMid1] * 35)))))
DynamicVariables=1
[MeasureMid1_G]
Measure=Calc
Formula=(#ColorStyle# = 1 ? Trunc(Sin((MeasureBaseDeg + 210.0) * 0.01745) * 127 + 128) : (#ColorStyle# = 2 ? Trunc(20 + [MeasureWaveMid1] * 220) : (#ColorStyle# = 3 ? Trunc(170 - [MeasureWaveMid1] * 110) : (#ColorStyle# = 4 ? Trunc(255 - [MeasureWaveMid1] * 75) : Trunc(140 - [MeasureWaveMid1] * 140)))))
DynamicVariables=1
[MeasureMid1_B]
Measure=Calc
Formula=(#ColorStyle# = 1 ? Trunc(Sin((MeasureBaseDeg + 330.0) * 0.01745) * 127 + 128) : (#ColorStyle# = 2 ? Trunc(147 + [MeasureWaveMid1] * 108) : (#ColorStyle# = 3 ? Trunc([MeasureWaveMid1] * 80) : (#ColorStyle# = 4 ? Trunc(136 + [MeasureWaveMid1] * 119) : Trunc([MeasureWaveMid1] * 30)))))
DynamicVariables=1

; --- Primary Color B (180.0 deg) ---
[MeasureCB_R]
Measure=Calc
Formula=(#ColorStyle# = 1 ? Trunc(Sin((MeasureBaseDeg + 180.0) * 0.01745) * 127 + 128) : (#ColorStyle# = 2 ? Trunc(255 - [MeasureWaveB] * 255) : (#ColorStyle# = 3 ? 255 : (#ColorStyle# = 4 ? 0 : Trunc(255 - [MeasureWaveB] * 35)))))
DynamicVariables=1
[MeasureCB_G]
Measure=Calc
Formula=(#ColorStyle# = 1 ? Trunc(Sin((MeasureBaseDeg + 300.0) * 0.01745) * 127 + 128) : (#ColorStyle# = 2 ? Trunc(20 + [MeasureWaveB] * 220) : (#ColorStyle# = 3 ? Trunc(170 - [MeasureWaveB] * 110) : (#ColorStyle# = 4 ? Trunc(255 - [MeasureWaveB] * 75) : Trunc(140 - [MeasureWaveB] * 140)))))
DynamicVariables=1
[MeasureCB_B]
Measure=Calc
Formula=(#ColorStyle# = 1 ? Trunc(Sin((MeasureBaseDeg + 60.0) * 0.01745) * 127 + 128) : (#ColorStyle# = 2 ? Trunc(147 + [MeasureWaveB] * 108) : (#ColorStyle# = 3 ? Trunc([MeasureWaveB] * 80) : (#ColorStyle# = 4 ? Trunc(136 + [MeasureWaveB] * 119) : Trunc([MeasureWaveB] * 30)))))
DynamicVariables=1

; --- Midpoint Color 2 (270.0 deg) ---
[MeasureMid2_R]
Measure=Calc
Formula=(#ColorStyle# = 1 ? Trunc(Sin((MeasureBaseDeg + 270.0) * 0.01745) * 127 + 128) : (#ColorStyle# = 2 ? Trunc(255 - [MeasureWaveMid2] * 255) : (#ColorStyle# = 3 ? 255 : (#ColorStyle# = 4 ? 0 : Trunc(255 - [MeasureWaveMid2] * 35)))))
DynamicVariables=1
[MeasureMid2_G]
Measure=Calc
Formula=(#ColorStyle# = 1 ? Trunc(Sin((MeasureBaseDeg + 30.0) * 0.01745) * 127 + 128) : (#ColorStyle# = 2 ? Trunc(20 + [MeasureWaveMid2] * 220) : (#ColorStyle# = 3 ? Trunc(170 - [MeasureWaveMid2] * 110) : (#ColorStyle# = 4 ? Trunc(255 - [MeasureWaveMid2] * 75) : Trunc(140 - [MeasureWaveMid2] * 140)))))
DynamicVariables=1
[MeasureMid2_B]
Measure=Calc
Formula=(#ColorStyle# = 1 ? Trunc(Sin((MeasureBaseDeg + 150.0) * 0.01745) * 127 + 128) : (#ColorStyle# = 2 ? Trunc(147 + [MeasureWaveMid2] * 108) : (#ColorStyle# = 3 ? Trunc([MeasureWaveMid2] * 80) : (#ColorStyle# = 4 ? Trunc(136 + [MeasureWaveMid2] * 119) : Trunc([MeasureWaveMid2] * 30)))))
DynamicVariables=1

; =======================================================
; 5. ALL 4 EDGES CONTINUOUS SINGLE-LOOP GAUSSIAN METERS
;    - Top Edge (Horizontal: Angle=0): Left (CA) -> Right (CB)
;    - Right Edge (Vertical: Angle=90): Top (CB) -> Bottom (CA)
;    - Bottom Edge (Horizontal: Angle=0): Left (CB) -> Right (CA)
;    - Left Edge (Vertical: Angle=90): Top (CA) -> Bottom (CB)
;
;    ==> ZERO RGB GRADIENT ACROSS THICKNESS (Pure length flow)
;    ==> Top-Left Corner: CA == CA (100% Mathematically Locked)
;    ==> Top-Right Corner: CB == CB (100% Mathematically Locked)
;    ==> Bottom-Right Corner: CA == CA (100% Mathematically Locked)
;    ==> Bottom-Left Corner: CB == CB (100% Mathematically Locked)
; =======================================================

; --- 1. TOP EDGE (Horizontal: Angle=0 along 1707px Length) ---
[MeterTopMask]
Meter=Image
ImageName=#@#edge_top_bloom.png
X=0
Y=0

[MeterTopGlow]
Meter=Shape
Shape=Rectangle 0, 0, #ScreenWidth#, #BloomDepth# | Fill LinearGradient GradTop | StrokeWidth 0
GradTop=0 | [MeasureCA_R],[MeasureCA_G],[MeasureCA_B],[MeasureAlpha] ; 0.00 | [MeasureMid1_R],[MeasureMid1_G],[MeasureMid1_B],[MeasureAlpha] ; 0.50 | [MeasureCB_R],[MeasureCB_G],[MeasureCB_B],[MeasureAlpha] ; 1.00
Container=MeterTopMask
DynamicVariables=1
X=0
Y=0

; --- 2. RIGHT EDGE (Vertical: Angle=90 along 960px Length) ---
[MeterRightMask]
Meter=Image
ImageName=#@#edge_right_bloom.png
X=(#ScreenWidth# - #BloomDepth#)
Y=0

[MeterRightGlow]
Meter=Shape
Shape=Rectangle 0, 0, #BloomDepth#, #ScreenHeight# | Fill LinearGradient GradRight | StrokeWidth 0
GradRight=90 | [MeasureCB_R],[MeasureCB_G],[MeasureCB_B],[MeasureAlpha] ; 0.00 | [MeasureMid2_R],[MeasureMid2_G],[MeasureMid2_B],[MeasureAlpha] ; 0.50 | [MeasureCA_R],[MeasureCA_G],[MeasureCA_B],[MeasureAlpha] ; 1.00
Container=MeterRightMask
DynamicVariables=1
X=0
Y=0

; --- 3. BOTTOM EDGE (Horizontal: Angle=0 along 1707px Length) ---
[MeterBottomMask]
Meter=Image
ImageName=#@#edge_bottom_bloom.png
X=0
Y=(#ScreenHeight# - #BloomDepth#)

[MeterBottomGlow]
Meter=Shape
Shape=Rectangle 0, 0, #ScreenWidth#, #BloomDepth# | Fill LinearGradient GradBottom | StrokeWidth 0
GradBottom=0 | [MeasureCB_R],[MeasureCB_G],[MeasureCB_B],[MeasureAlpha] ; 0.00 | [MeasureMid2_R],[MeasureMid2_G],[MeasureMid2_B],[MeasureAlpha] ; 0.50 | [MeasureCA_R],[MeasureCA_G],[MeasureCA_B],[MeasureAlpha] ; 1.00
Container=MeterBottomMask
DynamicVariables=1
X=0
Y=0

; --- 4. LEFT EDGE (Vertical: Angle=90 along 960px Length) ---
[MeterLeftMask]
Meter=Image
ImageName=#@#edge_left_bloom.png
X=0
Y=0

[MeterLeftGlow]
Meter=Shape
Shape=Rectangle 0, 0, #BloomDepth#, #ScreenHeight# | Fill LinearGradient GradLeft | StrokeWidth 0
GradLeft=90 | [MeasureCA_R],[MeasureCA_G],[MeasureCA_B],[MeasureAlpha] ; 0.00 | [MeasureMid1_R],[MeasureMid1_G],[MeasureMid1_B],[MeasureAlpha] ; 0.50 | [MeasureCB_R],[MeasureCB_G],[MeasureCB_B],[MeasureAlpha] ; 1.00
Container=MeterLeftMask
DynamicVariables=1
X=0
Y=0

