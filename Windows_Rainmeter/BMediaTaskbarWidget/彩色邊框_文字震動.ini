[Rainmeter]
Update=16
AccurateText=1
MiddleMouseUpAction=[!Refresh]
OnRefreshAction=[!CommandMeasure MeasureActionTimer "Execute 1"]

[Metadata]
Name=BTunes Taskbar Widget (Rotating Border + Bouncing Text)
Author=Partner Modified
Information=極簡流光旋轉邊框 + 置中文字重低音縮放震動 (無波紋版)
Version=1.0

[Variables]
BaseWidth=564
BaseHeight=46
AlbumArtSize=36
; 💡 字體大小預設為 16
TextFontSize=16
DetailsFontColor=30,30,30

animationSpeed=32
marqueeBeginWait=1500
marqueeEndWait=1500
marquee1=0

; 文字顯示區域設定
TextClipWidth=484
TextClipHeight=40
SongDetailPositionX=60

; =========================================
; 1. 音訊輸入與震動引擎
; =========================================
[MeasureAudioRaw]
Measure=Plugin
Plugin=AudioLevel
Port=Output
FFTSize=1024
FFTAttack=30
FFTDecay=45
Bands=3
FreqMin=20
FreqMax=16000
Sensitivity=42

[MeasureBass]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudioRaw
Type=Band
BandIdx=0

; 💡 獨立的文字震動引擎
[MeasureBounce]
Measure=Calc
Formula=(MeasureBass * 5)
AverageSize=2

; =========================================
; 2. 邊框色帶旋轉引擎 (色彩偏移法)
; =========================================
; 基礎速度 + 根據低音加速
[MeasureColorPhase]
Measure=Calc
Formula=(MeasureColorPhase + 0.003 + [MeasureBass]*0.05) % 1.0
DynamicVariables=1

; 色相偏移量（0-360度）
[MeasureColorShift]
Measure=Calc
Formula=MeasureColorPhase * 360
DynamicVariables=1

; 根據偏移計算當前主色 RGB
[MeasureMainR]
Measure=Calc
Formula=Trunc(Sin(MeasureColorShift * 0.01745) * 127 + 128)
DynamicVariables=1

[MeasureMainG]
Measure=Calc
Formula=Trunc(Sin((MeasureColorShift + 120) * 0.01745) * 127 + 128)
DynamicVariables=1

[MeasureMainB]
Measure=Calc
Formula=Trunc(Sin((MeasureColorShift + 240) * 0.01745) * 127 + 128)
DynamicVariables=1

; 另外兩種色彩（偏移 120 和 240 度）
[MeasureSecondR]
Measure=Calc
Formula=Trunc(Sin((MeasureColorShift + 120) * 0.01745) * 127 + 128)
DynamicVariables=1

[MeasureSecondG]
Measure=Calc
Formula=Trunc(Sin((MeasureColorShift + 240) * 0.01745) * 127 + 128)
DynamicVariables=1

[MeasureSecondB]
Measure=Calc
Formula=Trunc(Sin((MeasureColorShift + 360) * 0.01745) * 127 + 128)
DynamicVariables=1

[MeasureThirdR]
Measure=Calc
Formula=Trunc(Sin((MeasureColorShift + 240) * 0.01745) * 127 + 128)
DynamicVariables=1

[MeasureThirdG]
Measure=Calc
Formula=Trunc(Sin((MeasureColorShift + 360) * 0.01745) * 127 + 128)
DynamicVariables=1

[MeasureThirdB]
Measure=Calc
Formula=Trunc(Sin((MeasureColorShift + 120) * 0.01745) * 127 + 128)
DynamicVariables=1

; =========================================
; 3. 播放器資料讀取
; =========================================
[MeasurePlayer]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=PLAYER

[MeasureTitle]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=TITLE
DynamicVariables=1
OnChangeAction=[!SetVariable marquee1 0][!CommandMeasure MeasureActionTimer "Execute 1"]

[MeasureArtist]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=ARTIST
DynamicVariables=1

[MeasureDuration]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=DURATION
OnChangeAction=[!SetVariable marquee1 0][!CommandMeasure MeasureActionTimer "Execute 1"]
IfCondition=MeasureDuration < 1
IfTrueAction=[!Hide]
IfFalseAction=[!Show]

[MeasureMarquee1Offset]
Measure=Calc
Formula=max(0,([MeterDetails:W] - [MeterDetailContainer:W]))
DynamicVariables=1

[MeasureActionTimer]
Measure=Plugin
Plugin=ActionTimer
IgnoreExecution=1
ActionList1=Repeat Move1,#animationSpeed#,[MeasureMarquee1Offset:] | Wait #marqueeEndWait# | Reset1 | Wait #marqueeBeginWait# | DoOver1
Reset1=[!SetVariable marquee1 0][!UpdateMeasure MeasureActionTimer][!UpdateMeter MeterDetails][!Redraw]
Move1=[!SetVariable marquee1 "(#marquee1# - 1)"][!UpdateMeasure MeasureActionTimer][!UpdateMeter MeterDetails][!Redraw]
DoOver1=[!CommandMeasure MeasureActionTimer "Execute 1"]
DynamicVariables=1

[MeasureAlbumArt]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Cover
DefaultPath=
UpdateDivider=5

; =========================================
; 4. 顯示介面
; =========================================

; 💡 1. 最底層的「半透明白霧面底框」
[MeterWhiteBG]
Meter=Shape
Shape=Rectangle 4,4,(#BaseWidth#-8),(#BaseHeight#-8),8 | Fill Color 255,255,255,100 | StrokeWidth 0
X=0
Y=0

; 💡 2. 彩虹邊框（包覆在白框外，中心透明）
[MeterFrostedGlassBG]
Meter=Shape
Shape=Rectangle 4,4,(#BaseWidth#-8),(#BaseHeight#-8),8 | Fill Color 0,0,0,0 | Stroke LinearGradient MyGradient | StrokeWidth 8
MyGradient=0,0,0,46 | [MeasureMainR],[MeasureMainG],[MeasureMainB],255 ; 0.0 | [MeasureSecondR],[MeasureSecondG],[MeasureSecondB],255 ; 0.5 | [MeasureThirdR],[MeasureThirdG],[MeasureThirdB],255 ; 1.0
DynamicVariables=1
X=0
Y=0

; 💡 3. 邊框圓角蓋（隱形實心圓角蓋，防止邊框邊角戳出去）
[MeterBorderCap]
Meter=Shape
Shape=Rectangle 0,0,#BaseWidth#,#BaseHeight#,10 | Fill Color 0,0,0,0 | StrokeWidth 0
X=0
Y=0

[MeterAlbumArt]
Meter=Image
h=#AlbumArtSize#
w=#AlbumArtSize#
X=5
Y=5
MeasureName=MeasureAlbumArt
PreserveAspectRatio=1

[MeterDetailContainer]
Meter=Shape
Shape=Rectangle 0,0,#TextClipWidth#,#TextClipHeight#
X=#SongDetailPositionX#
Y=4

[MeterDetails]
Meter=String
MeasureName=MeasureArtist
MeasureName2=MeasureTitle
AntiAlias=1
FontColor=#DetailsFontColor#
FontFace=Segoe UI
FontWeight=700
; 💡 字體套用重低音震動放大引擎！
FontSize=(#TextFontSize# + [MeasureBounce])
Text="%1 | %2"
X=(#TextClipWidth#/2 + #marquee1#)
Y=(#TextClipHeight#/2)
; 💡 確保文字從正中心放大縮小
StringAlign=CenterCenter
Container=MeterDetailContainer
DynamicVariables=1