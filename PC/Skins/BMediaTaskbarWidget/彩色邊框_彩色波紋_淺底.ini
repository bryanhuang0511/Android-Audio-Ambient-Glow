[Rainmeter]
Update=16
AccurateText=1
MiddleMouseUpAction=[!Refresh]
OnRefreshAction=[!CommandMeasure MeasureActionTimer "Execute 1"]

[Metadata]
Name=BTunes Taskbar Widget (Rainbow Wave + Rotating Border)
Author=Partner Modified
Information=Pulsing rainbow wave + rotating gradient border with bass response
Version=1.0

[Variables]
BaseWidth=564
BaseHeight=46
AlbumArtSize=36
TextFontSize=13
DetailsFontColor=30,30,30

animationSpeed=32
marqueeBeginWait=1500
marqueeEndWait=1500
marquee1=0

W0=0
W1=0
W2=0
W3=0
W4=0
W5=0
W6=0
W7=0
W8=0
W9=0
W10=0
W11=0
W12=0
W13=0
W14=0

; =========================================
; 音訊輸入（必須在所有引用前定義）
; =========================================
[MeasureAudioRaw]
Measure=Plugin
Plugin=AudioLevel
Port=Output
FFTSize=1024
FFTAttack=30
FFTDecay=45
Bands=3
FreqMin=20
FreqMax=16000
Sensitivity=42

[MeasureBass]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudioRaw
Type=Band
BandIdx=0

[MeasureMid]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudioRaw
Type=Band
BandIdx=1

[MeasureHigh]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudioRaw
Type=Band
BandIdx=2

; =========================================
; 彩虹波紋引擎（原始保留）
; =========================================
[MeasureColorCounter]
Measure=Calc
Formula=(MeasureColorCounter + 0.01)
; 這個 0.01 是變色速度，數字越大變色越快，你可以根據喜好微調！

[MeasureR]
Measure=Calc
Formula=Trunc(Sin(MeasureColorCounter) * 127 + 128)

[MeasureG]
Measure=Calc
Formula=Trunc(Sin(MeasureColorCounter + 2.094) * 127 + 128)
; 2.094 是用來把綠色錯開，才不會大家一起變亮變暗

[MeasureB]
Measure=Calc
Formula=Trunc(Sin(MeasureColorCounter + 4.188) * 127 + 128)
; 4.188 是用來把藍色錯開

; =========================================
; 邊框色帶旋轉引擎（新設計：色彩偏移法）
; =========================================
; 💡 核心概念：邊框漸層固定（上下方向），但色彩序列根據時間偏移
; 這樣看起來就像七彩色帶在邊框上跑動

; 色帶位置 (0-1，代表在1個完整七彩周期中的位置)
; 基礎速度 + 根據低音加速
[MeasureColorPhase]
Measure=Calc
Formula=(MeasureColorPhase + 0.003 + [MeasureBass]*0.05) % 1.0
DynamicVariables=1

; 色相偏移量（0-360度）
[MeasureColorShift]
Measure=Calc
Formula=MeasureColorPhase * 360
DynamicVariables=1

; 根據偏移計算當前主色 RGB
[MeasureMainR]
Measure=Calc
Formula=Trunc(Sin(MeasureColorShift * 0.01745) * 127 + 128)
DynamicVariables=1

[MeasureMainG]
Measure=Calc
Formula=Trunc(Sin((MeasureColorShift + 120) * 0.01745) * 127 + 128)
DynamicVariables=1

[MeasureMainB]
Measure=Calc
Formula=Trunc(Sin((MeasureColorShift + 240) * 0.01745) * 127 + 128)
DynamicVariables=1

; 另外兩種色彩（偏移 120 和 240 度）
[MeasureSecondR]
Measure=Calc
Formula=Trunc(Sin((MeasureColorShift + 120) * 0.01745) * 127 + 128)
DynamicVariables=1

[MeasureSecondG]
Measure=Calc
Formula=Trunc(Sin((MeasureColorShift + 240) * 0.01745) * 127 + 128)
DynamicVariables=1

[MeasureSecondB]
Measure=Calc
Formula=Trunc(Sin((MeasureColorShift + 360) * 0.01745) * 127 + 128)
DynamicVariables=1

[MeasureThirdR]
Measure=Calc
Formula=Trunc(Sin((MeasureColorShift + 240) * 0.01745) * 127 + 128)
DynamicVariables=1

[MeasureThirdG]
Measure=Calc
Formula=Trunc(Sin((MeasureColorShift + 360) * 0.01745) * 127 + 128)
DynamicVariables=1

[MeasureThirdB]
Measure=Calc
Formula=Trunc(Sin((MeasureColorShift + 120) * 0.01745) * 127 + 128)
DynamicVariables=1

[MeasureEnergy]
Measure=Calc
Formula=Clamp(Clamp([MeasureBass]*30,0,30) + Clamp([MeasureMid]*10 + [MeasureHigh]*5,0,7), 0, 37)
DynamicVariables=1

[MeasureEnergySmooth]
Measure=Calc
Formula=MeasureEnergy
AverageSize=2

[MeasurePropagate]
Measure=Calc
Formula=1
OnUpdateAction=[!SetVariable W14 "#W13#"][!SetVariable W13 "#W12#"][!SetVariable W12 "#W11#"][!SetVariable W11 "#W10#"][!SetVariable W10 "#W9#"][!SetVariable W9 "#W8#"][!SetVariable W8 "#W7#"][!SetVariable W7 "#W6#"][!SetVariable W6 "#W5#"][!SetVariable W5 "#W4#"][!SetVariable W4 "#W3#"][!SetVariable W3 "#W2#"][!SetVariable W2 "#W1#"][!SetVariable W1 "#W0#"][!SetVariable W0 "[MeasureEnergySmooth]"]
DynamicVariables=1

[MeasurePlayer]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=PLAYER

[MeasureTitle]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=TITLE
DynamicVariables=1
OnChangeAction=[!SetVariable marquee1 0][!CommandMeasure MeasureActionTimer "Execute 1"]

[MeasureArtist]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=ARTIST
DynamicVariables=1

[MeasureDuration]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=DURATION
OnChangeAction=[!SetVariable marquee1 0][!CommandMeasure MeasureActionTimer "Execute 1"]
IfCondition=MeasureDuration < 1
IfTrueAction=[!Hide]
IfFalseAction=[!Show]

[MeasureMarquee1Offset]
Measure=Calc
Formula=max(0,([MeterDetails:W] - [MeterDetailContainer:W]))
DynamicVariables=1

[MeasureActionTimer]
Measure=Plugin
Plugin=ActionTimer
IgnoreExecution=1
ActionList1=Repeat Move1,#animationSpeed#,[MeasureMarquee1Offset:] | Wait #marqueeEndWait# | Reset1 | Wait #marqueeBeginWait# | DoOver1
Reset1=[!SetVariable marquee1 0][!UpdateMeasure MeasureActionTimer][!UpdateMeter MeterDetails][!Redraw]
Move1=[!SetVariable marquee1 "(#marquee1# - 1)"][!UpdateMeasure MeasureActionTimer][!UpdateMeter MeterDetails][!Redraw]
DoOver1=[!CommandMeasure MeasureActionTimer "Execute 1"]
DynamicVariables=1

[MeasureAlbumArt]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Cover
DefaultPath=
UpdateDivider=5

[MeterWaveMask]
Meter=Shape
Shape=Rectangle 0,0,#BaseWidth#,#BaseHeight#,10 | Fill Color 0,0,0,255 | StrokeWidth 0
X=0
Y=0

[MeterCrashWave]
Meter=Shape
Shape=Path MyWave | Fill Color [MeasureR],[MeasureG],[MeasureB],240 | StrokeWidth 0
MyWave=0,48 | LineTo 2,(46-#W14#) | LineTo 22,(46-#W13#) | LineTo 42,(46-#W12#) | LineTo 62,(46-#W11#) | LineTo 82,(46-#W10#) | LineTo 102,(46-#W9#) | LineTo 122,(46-#W8#) | LineTo 142,(46-#W7#) | LineTo 162,(46-#W6#) | LineTo 182,(46-#W5#) | LineTo 202,(46-#W4#) | LineTo 222,(46-#W3#) | LineTo 242,(46-#W2#) | LineTo 262,(46-#W1#) | LineTo 282,(46-#W0#) | LineTo 302,(46-#W1#) | LineTo 322,(46-#W2#) | LineTo 342,(46-#W3#) | LineTo 362,(46-#W4#) | LineTo 382,(46-#W5#) | LineTo 402,(46-#W6#) | LineTo 422,(46-#W7#) | LineTo 442,(46-#W8#) | LineTo 462,(46-#W9#) | LineTo 482,(46-#W10#) | LineTo 502,(46-#W11#) | LineTo 522,(46-#W12#) | LineTo 542,(46-#W13#) | LineTo 562,(46-#W14#) | LineTo 562,46 | ClosePath 1
Container=MeterWaveMask
DynamicVariables=1

; 💡 彩虹邊框（在波紋之上，蓋住邊界）
; 重點：邊框 Stroke 會向外擴展，所以要向內縮小矩形坐標
; StrokeWidth 8 → 向內縮 4px（上下左右各 4px）
[MeterFrostedGlassBG]
Meter=Shape
Shape=Rectangle 4,4,(#BaseWidth#-8),(#BaseHeight#-8),8 | Fill Color 0,0,0,0 | Stroke LinearGradient MyGradient | StrokeWidth 8
; 色帶在邊框上移動的錯覺
MyGradient=0,0,0,46 | [MeasureMainR],[MeasureMainG],[MeasureMainB],255 ; 0.0 | [MeasureSecondR],[MeasureSecondG],[MeasureSecondB],255 ; 0.5 | [MeasureThirdR],[MeasureThirdG],[MeasureThirdB],255 ; 1.0
DynamicVariables=1
X=0
Y=0

; 💡 邊框圓角蓋（隱形實心圓角蓋，防止邊框邊角戳出去）
[MeterBorderCap]
Meter=Shape
Shape=Rectangle 0,0,#BaseWidth#,#BaseHeight#,10 | Fill Color 255,255,255,100 | StrokeWidth 0
X=0
Y=0

[MeterAlbumArt]
Meter=Image
h=#AlbumArtSize#
w=#AlbumArtSize#
X=5
Y=5
MeasureName=MeasureAlbumArt
PreserveAspectRatio=1
; 💡 嘗試使用 MaskImage - 如果 WebNowPlaying 不支持，圖片會正常顯示但無圓角

; 💡 相冊圖片圓角遮罩（在圖片上層，蓋住四個角）
[MeterAlbumArtMask]
Meter=Shape
Shape=Rectangle 0,0,#AlbumArtSize#,#AlbumArtSize#,6 | Fill Color 0,0,0,0 | Stroke Color 255,255,255,150 | StrokeWidth 0
X=5
Y=5
; MaskImage 需要一個黑白圖片，黑色部分透明，白色部分顯示
; 這裡我們用形狀定義圓角遮罩

[MeterDetailContainer]
Meter=Shape
Shape=Rectangle 0,0,484,30
X=60
Y=14

[MeterDetails]
Meter=String
MeasureName=MeasureArtist
MeasureName2=MeasureTitle
AntiAlias=1
FontColor=#DetailsFontColor#
FontFace=Segoe UI
FontWeight=700
FontSize=#TextFontSize#
Text="%1 | %2"
X=(242 + #marquee1#)
Y=0
StringAlign=Center
Container=MeterDetailContainer
DynamicVariables=1